# https://doc.rust-lang.org/cargo/reference/manifest.html
[package]
name = "gg"
version = "0.1.0"
authors = ["Marcelo Cantos <marcelo.cantos@gmail.com>"]
edition = "2021"
description = "gg makes it easy to find, fetch and work with your git repos."
keywords = ["git"]
license = "Apache-2.0"

[dependencies]
anyhow = "1.0.65"
clap = { version = "4", features = ["derive"] }
home = "0.5.3"
regex = "1.6.0"

[dev-dependencies]
tempfile = "3"

# The benchmark harness is benches/bench.rs itself — no framework, so no
# criterion (and no plotters or rayon) in the dev graph of a 550-line
# crate. `cargo bench -- --gate` is the perf gate; see docs/perf/baseline.md.
[[bench]]
name = "bench"
harness = false
