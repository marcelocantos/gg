name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo clippy -- -D warnings
      - run: cargo test
      - run: cargo fmt -- --check
      # The benchmarks build and run for one pass on every push, so a
      # change that breaks the harness fails here rather than the next
      # time someone re-locks. --loose compares only what a hosted
      # runner can honestly decide: the bytes of shell gg emits, which
      # are a function of the code. Timings belong to the machine the
      # baseline was recorded on, and so does the binary's size.
      - run: cargo bench --bench bench -- --gate --loose
